site_name: EduInfra AI
site_description: Infraestrutura escolar e desempenho no ENEM — Sistemas de Banco de Dados 2 (UnB/FCTE)
site_url: https://daviegito.github.io/bd2_2026_2_eduinfra/
site_author: Squad EduInfra (UnB / FCTE, 2026.2)
repo_url: https://github.com/daviegito/bd2_2026_2_eduinfra
repo_name: daviegito/bd2_2026_2_eduinfra

theme:
  name: material
  language: pt
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Início: index.md
  - Projeto:
      - Arquitetura: arquitetura.md
      - Modelo da origem: modelo-origem.md
      - Modelo analítico: modelo-analitico.md
      - Fontes, equipe e entregas: projeto.md
  - Execução:
      - Como executar e demonstrar: execucao.md
      - Transformação declarativa: transformacao.md
      - Testes: testes.md
      - Orquestração: orquestracao.md
  - Dados e ingestão:
      - Caracterização da carga: caracterizacao.md
      - ENEM e junção com o Censo: enem.md
      - Compressão: serializacao-compressao.md
      - CDC e semântica de entrega: cdc-e-semantica-de-entrega.md
      - Métricas do CDC: metricas-cdc.md
      - Dados atrasados: dado-atrasado.md
      - Camada analítica: camada-analitica.md
      - Frescor e SLA da Gold: frescor-e-sla.md
  - Decisões:
      - Índice dos ADRs: adr/README.md
      - ADR 0001 — Insert-only: adr/0001-modelagem-insert-only-do-sistema-de-origem.md
      - ADR 0002 — TLS: adr/0002-cadeia-tls-incompleta-do-inep.md
      - ADR 0004 — Ingestão: adr/0004-ingestao.md
      - ADR 0005 — Transformação: adr/0005-ferramenta-de-transformacao.md
      - ADR 0007 — Telemetria e fila de erros: adr/0007-telemetria-e-fila-de-erros-do-cdc.md
      - ADR 0008 — Fonte única de eventos: adr/0008-fonte-canonica-de-eventos.md
  - Processo:
      - Diário de bordo: diario/diario-de-bordo.md
      - Uso de IA: https://github.com/daviegito/bd2_2026_2_eduinfra/blob/main/AI-USAGE.md
