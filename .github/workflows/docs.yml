name: Documentação

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas de documentação
        run: python -m pip install mkdocs==1.6.1 mkdocs-material==9.7.7

      #Geração Painel E4 (Injeção com env)
      - name: Subir banco, construir Gold e gerar painel
        env:
          POSTGRES_USER: eduinfra
          POSTGRES_PASSWORD: eduinfra
          POSTGRES_DB: eduinfra
          PORTA_POSTGRES: 5432
          ANO_CENSO: 2024
        run: |
          docker compose up -d banco
          docker compose run --rm carga migrar
          docker compose run --rm carga gerar_amostra --escolas 1000
          docker compose run --rm carga construir-gold
          docker compose run --rm -v ./docs:/app/docs carga gerar-painel

      #Mostra o erro real se o banco falhar
      - name: 🚨 Mostrar logs do banco se der erro
        if: failure()
        run: docker compose logs banco

      - name: Gerar o site e verificar links internos
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site-documentacao
          path: site/

  publicar:
    name: Publicar no GitHub Pages
    needs: validar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas de documentação
        run: python -m pip install mkdocs==1.6.1 mkdocs-material==9.7.7

      # Repete a geração do painel E4 para deploy
      - name: Subir banco, construir Gold e gerar painel
        env:
          POSTGRES_USER: eduinfra
          POSTGRES_PASSWORD: eduinfra
          POSTGRES_DB: eduinfra
          PORTA_POSTGRES: 5432
          ANO_CENSO: 2024
        run: |
          docker compose up -d banco
          docker compose run --rm carga construir-gold
          docker compose run --rm -v ./docs:/app/docs carga gerar-painel

      - name: 🚨 Mostrar logs do banco se der erro
        if: failure()
        run: docker compose logs banco

      - name: Publicar na branch gh-pages
        run: mkdocs gh-deploy --strict
      - name: Solicitar atualização do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
