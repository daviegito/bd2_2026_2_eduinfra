name: Documentação

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "src/eduinfra/painel.py"
      - "src/eduinfra/semantica.py"
      - "src/eduinfra/cli.py"
      - "src/eduinfra/orquestrador.py"
      - "metricas/**"
      - "tests/test_semantica*.py"
      - "tests/test_metricas.py"
      - "tests/test_orquestrador.py"
      - "tests/preparar_semantica.py"
      - "alembic/**"
      - "tests/test_painel.py"
      - "tests/test_e3_gold.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "transformacao/scripts/preparar_fontes_ci.py"
      - "tests/test_preparar_fontes_ci.py"
      - "src/eduinfra/microdados.py"
      - "src/eduinfra/configuracao.py"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "src/eduinfra/painel.py"
      - "src/eduinfra/semantica.py"
      - "src/eduinfra/cli.py"
      - "src/eduinfra/orquestrador.py"
      - "metricas/**"
      - "tests/test_semantica*.py"
      - "tests/test_metricas.py"
      - "tests/test_orquestrador.py"
      - "tests/preparar_semantica.py"
      - "alembic/**"
      - "tests/test_painel.py"
      - "tests/test_e3_gold.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "transformacao/scripts/preparar_fontes_ci.py"
      - "tests/test_preparar_fontes_ci.py"
      - "src/eduinfra/microdados.py"
      - "src/eduinfra/configuracao.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantica:
    name: Validar contrato semântico e papéis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEMANTICA_BANCADA_DSN: postgresql://eduinfra83:validacao83_local@127.0.0.1:55483/eduinfra83
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eduinfra83
          POSTGRES_PASSWORD: validacao83_local
          POSTGRES_DB: eduinfra83
        ports:
          - 55483:5432
        options: >-
          --health-cmd "pg_isready -U eduinfra83"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Preparar dependências já declaradas
        run: uv sync --locked --group dev
      - name: Conferir a migração de acesso do PR 110
        run: |
          # Snapshot explícito; atualizar e revalidar quando o contrato do #110 mudar.
          git fetch --depth=1 origin 0d83bc291bf49a3c6c28842cfb8e2ed305c6bb84
          git show 0d83bc291bf49a3c6c28842cfb8e2ed305c6bb84:alembic/versions/0010_controle_de_acesso.py > /tmp/controle_acesso_0010.py
          git fetch --depth=1 origin 8e873976a975a1053969196b2deddad8212ed475
          mkdir -p /tmp/eduinfra103-legado
          git show 8e873976a975a1053969196b2deddad8212ed475:src/eduinfra/semantica.py > /tmp/eduinfra103-legado/semantica.py
          SEMANTICA_PUBLICADOR_LEGADO=/tmp/eduinfra103-legado/semantica.py uv run --no-sync python tests/preparar_semantica.py --dsn "$SEMANTICA_BANCADA_DSN" --migracao-acesso /tmp/controle_acesso_0010.py
          # Repetir não reaplica políticas nem retrocede a revisão do Alembic.
          SEMANTICA_PUBLICADOR_LEGADO=/tmp/eduinfra103-legado/semantica.py uv run --no-sync python tests/preparar_semantica.py --dsn "$SEMANTICA_BANCADA_DSN" --migracao-acesso /tmp/controle_acesso_0010.py
      - name: Testar publicação, leitura, CLI e orquestração sem skips
        run: |
          uv run --no-sync pytest tests/test_semantica.py tests/test_semantica_cli.py tests/test_metricas.py tests/test_orquestrador.py -q -rs --junitxml=/tmp/semantica.xml
          uv run --no-sync python -c "import xml.etree.ElementTree as E; r=E.parse('/tmp/semantica.xml'); assert sum(int(s.get('skipped',0)) for s in r.iter('testsuite')) == 0, 'Testes semânticos não podem ser ignorados no CI'"

  validar:
    name: Validar o site
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: eduinfra
      POSTGRES_PASSWORD: eduinfra
      POSTGRES_DB: eduinfra
      PORTA_POSTGRES: 5432
      ANO_CENSO: 2024
      ANO_ENEM: 2024
      DATA_REFERENCIA_ENEM: "2024-11-03"
      MAX_SLOT_WAL_KEEP_SIZE: 2GB
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      # Aumentar a revisão força o download se a fonte do mesmo ano for republicada.
      REVISAO_CACHE_FONTES: v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas de documentação
        run: python -m pip install mkdocs==1.6.1 mkdocs-material==9.7.7
      - name: Preparar diretórios do cache no runner
        id: diretorios-cache
        run: mkdir -p .cache/fontes-inep/enem
      - name: Construir as imagens
        run: docker compose build carga cdc transformacao
      - name: Conferir o painel e o preparo das fontes antes da carga nacional
        run: |
          docker compose run --no-deps --rm -v "$PWD/.github/workflows:/app/.github/workflows:ro" --entrypoint uv carga run --locked --group dev --group transformacao pytest tests/test_painel.py tests/test_preparar_fontes_ci.py -q
      - name: Restaurar os ZIPs públicos do INEP
        id: fontes-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            .cache/fontes-inep/censo_escolar_${{ env.ANO_CENSO }}.zip
            .cache/fontes-inep/enem/microdados_enem_${{ env.ANO_ENEM }}.zip
          key: ${{ runner.os }}-inep-zip-${{ env.REVISAO_CACHE_FONTES }}-${{ env.ANO_CENSO }}-${{ env.ANO_ENEM }}-${{ hashFiles('src/eduinfra/configuracao.py', 'src/eduinfra/microdados.py', 'docker-compose.yml') }}
      - name: Preparar e medir as fontes sem iniciar o banco
        run: |
          docker compose run --no-deps --rm --entrypoint uv carga run --no-sync python transformacao/scripts/preparar_fontes_ci.py --saida /dados/bruto/tempos-ci.json
      - name: Salvar os ZIPs antes das etapas de integração
        if: steps.fontes-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            .cache/fontes-inep/censo_escolar_${{ env.ANO_CENSO }}.zip
            .cache/fontes-inep/enem/microdados_enem_${{ env.ANO_ENEM }}.zip
          key: ${{ steps.fontes-cache.outputs.cache-primary-key }}
      - name: Construir e testar a Gold com as fontes reais
        run: docker compose run --rm transformacao
      - name: Conferir a auditoria da Gold
        run: |
          docker compose run --no-deps --rm --entrypoint uv carga run --no-sync python -m unittest tests.test_e3_gold -v
      - name: Gerar o painel real
        run: |
          docker compose run --no-deps --rm -v "$PWD/docs:/app/docs" carga gerar-painel
          test -s docs/painel.html
          # Confere componentes funcionais sem depender do texto dos títulos.
          grep -Fq 'id="dados-painel"' docs/painel.html
          grep -Fq 'id="painel-calculos"' docs/painel.html
          grep -Fq 'id="grafico-relacao"' docs/painel.html
      - name: Guardar os tempos de preparo das fontes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tempos-fontes
          path: .cache/fontes-inep/tempos-ci.json
          if-no-files-found: ignore
      - name: Mostrar logs do pipeline se houver falha
        if: failure()
        run: docker compose logs banco carga cdc
      - name: Gerar o site e verificar a inclusão do painel
        run: |
          mkdocs build --strict
          test -s site/painel.html
          cmp docs/painel.html site/painel.html
          cd site && sha256sum painel.html > painel.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: site-documentacao
          path: site/
          if-no-files-found: error

  publicar:
    name: Publicar no GitHub Pages
    needs: [validar, semantica]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas de documentação
        run: python -m pip install mkdocs==1.6.1 mkdocs-material==9.7.7
      - uses: actions/download-artifact@v4
        with:
          name: site-documentacao
          path: site/
      - name: Conferir o painel validado
        run: cd site && sha256sum --check painel.sha256
      - name: Publicar o mesmo site validado na branch gh-pages
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python -m ghp_import --no-jekyll --push site
      - name: Solicitar atualização do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
