services:
  banco:
    image: pgvector/pgvector:pg16
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=${MAX_SLOT_WAL_KEEP_SIZE:-1GB}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PORTA_POSTGRES:-5432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migracao:
    build: .
    profiles: [admin]
    environment:
      DATABASE_URL: postgresql://eduinfra_carga:${EDUINFRA_SENHA_CARGA:-senha_local_carga}@banco:5432/${POSTGRES_DB}
      DATABASE_URL_ADMIN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@banco:5432/${POSTGRES_DB}
      EDUINFRA_SENHA_CARGA: ${EDUINFRA_SENHA_CARGA:-senha_local_carga}
      EDUINFRA_SENHA_DBT: ${EDUINFRA_SENHA_DBT:-senha_local_dbt}
      EDUINFRA_SENHA_CDC: ${EDUINFRA_SENHA_CDC:-senha_local_cdc}
      EDUINFRA_SENHA_CDC_BANCADA: ${EDUINFRA_SENHA_CDC_BANCADA:-senha_local_cdc_bancada}
      EDUINFRA_SENHA_PAINEL: ${EDUINFRA_SENHA_PAINEL:-senha_local_painel}
      EDUINFRA_SENHA_ANALISE: ${EDUINFRA_SENHA_ANALISE:-senha_local_analise}
      EDUINFRA_SENHA_TECNICO_DF: ${EDUINFRA_SENHA_TECNICO_DF:-senha_local_tecnico_df}
      EDUINFRA_SENHA_TECNICO_SP: ${EDUINFRA_SENHA_TECNICO_SP:-senha_local_tecnico_sp}
      EDUINFRA_SENHA_ORQUESTRADOR: ${EDUINFRA_SENHA_ORQUESTRADOR:-senha_local_orquestrador}
    depends_on:
      banco:
        condition: service_healthy
    restart: "no"
    command: ["migrar"]

  carga:
    build: .
    environment:
      DATABASE_URL: postgresql://eduinfra_carga:${EDUINFRA_SENHA_CARGA:-senha_local_carga}@banco:5432/${POSTGRES_DB}
      DATABASE_URL_TRANSFORMACAO: postgresql://eduinfra_dbt:${EDUINFRA_SENHA_DBT:-senha_local_dbt}@banco:5432/${POSTGRES_DB}
      DATABASE_URL_ORQUESTRADOR: postgresql://eduinfra_orquestrador:${EDUINFRA_SENHA_ORQUESTRADOR:-senha_local_orquestrador}@banco:5432/${POSTGRES_DB}
      DATABASE_URL_CDC: postgresql://eduinfra_cdc:${EDUINFRA_SENHA_CDC:-senha_local_cdc}@banco:5432/${POSTGRES_DB}
      DATABASE_URL_CDC_BANCADA: postgresql://eduinfra_cdc_bancada:${EDUINFRA_SENHA_CDC_BANCADA:-senha_local_cdc_bancada}@banco:5432/${POSTGRES_DB}
      DIRETORIO_DADOS: /dados
      ANO_CENSO: ${ANO_CENSO:-2024}
      ANO_ENEM: ${ANO_ENEM:-2024}
      DATA_REFERENCIA_ENEM: ${DATA_REFERENCIA_ENEM:-2024-11-03}
    volumes:
      - dados_censo:/dados
    depends_on:
      banco:
        condition: service_healthy
    restart: "no"
    command: ["tudo"]

  transformacao:
    build: .
    environment:
      DATABASE_URL: postgresql://eduinfra_orquestrador:${EDUINFRA_SENHA_ORQUESTRADOR:-senha_local_orquestrador}@banco:5432/${POSTGRES_DB}
      DATABASE_URL_TRANSFORMACAO: postgresql://eduinfra_dbt:${EDUINFRA_SENHA_DBT:-senha_local_dbt}@banco:5432/${POSTGRES_DB}
      POSTGRES_HOST: banco
      POSTGRES_PORT: 5432
      POSTGRES_USER: eduinfra_dbt
      POSTGRES_PASSWORD: ${EDUINFRA_SENHA_DBT:-senha_local_dbt}
      POSTGRES_DB: ${POSTGRES_DB}
      DIRETORIO_DADOS: /dados
      ANO_CENSO: ${ANO_CENSO:-2024}
      ANO_ENEM: ${ANO_ENEM:-2024}
      DATA_REFERENCIA_ENEM: ${DATA_REFERENCIA_ENEM:-2024-11-03}
    volumes:
      - dados_censo:/dados
    depends_on:
      carga:
        condition: service_completed_successfully
    restart: "no"

  cdc:
    build: .
    environment:
      DATABASE_URL: postgresql://eduinfra_cdc:${EDUINFRA_SENHA_CDC:-senha_local_cdc}@banco:5432/${POSTGRES_DB}
      DATABASE_URL_CDC: postgresql://eduinfra_cdc:${EDUINFRA_SENHA_CDC:-senha_local_cdc}@banco:5432/${POSTGRES_DB}
      DIRETORIO_DADOS: /dados
    volumes:
      - dados_censo:/dados
    depends_on:
      banco:
        condition: service_healthy
    restart: unless-stopped
    command: ["cdc", "--continuo", "--intervalo", "2"]
    healthcheck:
      test: ["CMD-SHELL", "test $$(($$(date +%s) - $$(stat -c %Y /tmp/cdc_vivo))) -lt 60"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s

  orquestrador:
    build: .
    environment:
      DATABASE_URL: postgresql://eduinfra_orquestrador:${EDUINFRA_SENHA_ORQUESTRADOR:-senha_local_orquestrador}@banco:5432/${POSTGRES_DB}
      DATABASE_URL_TRANSFORMACAO: postgresql://eduinfra_dbt:${EDUINFRA_SENHA_DBT:-senha_local_dbt}@banco:5432/${POSTGRES_DB}
      DATABASE_URL_CDC: postgresql://eduinfra_cdc:${EDUINFRA_SENHA_CDC:-senha_local_cdc}@banco:5432/${POSTGRES_DB}
      POSTGRES_HOST: banco
      POSTGRES_PORT: 5432
      POSTGRES_USER: eduinfra_dbt
      POSTGRES_PASSWORD: ${EDUINFRA_SENHA_DBT:-senha_local_dbt}
      POSTGRES_DB: ${POSTGRES_DB}
      DIRETORIO_DADOS: /dados
      ANO_CENSO: ${ANO_CENSO:-2024}
      ANO_ENEM: ${ANO_ENEM:-2024}
      DATA_REFERENCIA_ENEM: ${DATA_REFERENCIA_ENEM:-2024-11-03}
      AGENDA_ORQUESTRADOR: ${AGENDA_ORQUESTRADOR:-0 3 * * *}
    ports:
      - "${PORTA_DAGSTER:-3000}:3000"
    volumes:
      - dados_censo:/dados
      - dados_dagster:/opt/dagster/dagster_home
    depends_on:
      banco:
        condition: service_healthy

  painel:
    build: .
    profiles: [analitico]
    environment:
      DATABASE_URL: postgresql://eduinfra_painel:${EDUINFRA_SENHA_PAINEL:-senha_local_painel}@banco:5432/${POSTGRES_DB}
      DIRETORIO_DADOS: /dados
    volumes:
      - dados_censo:/dados
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados_postgres:
  dados_censo:
  dados_dagster:
