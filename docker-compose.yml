services:
  banco:
    image: pgvector/pgvector:pg16
    # Decodificação lógica do WAL: pré-requisito do CDC da E2 (issue #22).
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PORTA_POSTGRES:-5432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  carga:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@banco:5432/${POSTGRES_DB}
      DIRETORIO_DADOS: /dados
      ANO_CENSO: ${ANO_CENSO:-2024}
    volumes:
      - dados_censo:/dados
    depends_on:
      banco:
        condition: service_healthy
    restart: "no"
    command: ["tudo"]

  cdc:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@banco:5432/${POSTGRES_DB}
      DIRETORIO_DADOS: /dados
    volumes:
      - dados_censo:/dados
    depends_on:
      carga:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["cdc", "--continuo", "--intervalo", "2"]
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/cdc_vivo) )) -lt 60"]
      interval: 15s
      timeout: 5s
      retries: 3
      # A primeira passada depois de subir leva de 65 a 86 s no Docker Desktop
      # (medido); só então o consumidor cria /tmp/cdc_vivo.
      start_period: 120s

volumes:
  dados_postgres:
  dados_censo:
