services:
  banco:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PORTA_POSTGRES:-5432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  carga:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@banco:5432/${POSTGRES_DB}
      DIRETORIO_DADOS: /dados
      ANO_CENSO: ${ANO_CENSO:-2024}
    volumes:
      - dados_censo:/dados
    depends_on:
      banco:
        condition: service_healthy
    restart: "no"
    command: ["tudo"]

volumes:
  dados_postgres:
  dados_censo:
