[project]
name = "eduinfra"
version = "0.1.0"
description = "Origem transacional de vistorias de infraestrutura escolar do EduInfra AI"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "certifi>=2026.7.22",
    "cryptography>=50.0.1",
    "duckdb>=1.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.scripts]
eduinfra = "eduinfra.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eduinfra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integracao: exige banco de dados em execução"]
