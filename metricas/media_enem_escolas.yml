nome: media_enem_escolas
titulo: Média das escolas no ENEM
versao: 1.0.0
status: ativa
historico:
  - versao: 1.0.0
    data: 2026-11-22
    mudanca: primeira definição
dono: lucasarruda9

descricao: Média das notas das escolas do grupo no ENEM.
grao: uma linha por escola e ano

formula: |
  -- média geral; para uma área, troque media_geral por
  -- media_cn, media_ch, media_lc, media_mt ou media_redacao
  select count(f.media_geral)       as n_escolas,
         avg(f.media_geral)         as media,
         stddev_samp(f.media_geral) as desvio_padrao
  from gold.fato_desempenho_escola_ano f
  join gold.dim_escola e using (co_entidade)
  left join gold.dim_municipio m using (co_municipio)
  left join gold.dim_escola_infraestrutura d on d.escola_infra_sk = f.escola_infra_sk
  where f.ano = 2024
    and e.ano_censo_referencia = 2024
    and f.media_geral is not null
    -- filtros do grupo, por exemplo:
    -- and m.sg_uf = 'DF' and e.rede = 'estadual' and d.itens ->> 'biblioteca' = 'existente'
  having count(f.media_geral) >= 10

fonte:
  - gold.fato_desempenho_escola_ano
  - gold.dim_escola
  - gold.dim_municipio
  - gold.dim_escola_infraestrutura

filtros:
  - área da prova
  - UF
  - município
  - rede
  - localização
  - situação de um item

supressao:
  minimo: 10
  regra: grupo com menos de 10 escolas com nota não mostra a média

consumidores:
  - painel
