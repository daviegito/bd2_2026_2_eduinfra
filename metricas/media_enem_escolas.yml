nome: media_enem_escolas
titulo: Média das escolas no ENEM
versao: 1.1.0
status: ativa
historico:
- versao: 1.1.0
  data: '2026-11-24'
  mudanca: interface executável com ano e filtros parametrizados; preserva população, média e supressão
- versao: 1.0.0
  data: 2026-11-22
  mudanca: primeira definição
dono: lucasarruda9
descricao: Média das notas das escolas do grupo no ENEM.
grao: uma linha por escola e ano
formula: |
  select count((e.notas->>q.area)::numeric) as n_escolas,
         avg((e.notas->>q.area)::numeric) as media,
         stddev_samp((e.notas->>q.area)::numeric) as desvio_padrao
  from metricas.base_analise e cross join parametros q
  where e.ano = q.ano
      and (q.uf is null or e.uf = q.uf)
      and (q.municipio is null or e.co_municipio = q.municipio)
      and (q.rede is null or e.rede = q.rede)
      and (q.localizacao is null or e.localizacao = q.localizacao)
      and (e.notas->>q.area) is not null
      and (q.item is null or q.situacao is null
           or coalesce(e.itens_enem->>q.item, 'nao_informado') = q.situacao)
  having count((e.notas->>q.area)::numeric) >= {{ minimo }}
fonte:
- gold.fato_desempenho_escola_ano
- gold.dim_escola
- gold.dim_municipio
- gold.dim_escola_infraestrutura
filtros:
- área da prova
- UF
- município
- rede
- localização
- situação de um item
supressao:
  minimo: 10
  regra: grupo com menos de 10 escolas com nota não mostra a média
consumidores:
- painel
interface:
  parametros:
  - ano
  - uf
  - municipio
  - rede
  - localizacao
  - item
  - area
  - situacao
  item_obrigatorio: false
