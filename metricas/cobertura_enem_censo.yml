nome: cobertura_enem_censo
titulo: Cobertura da junção ENEM e Censo
versao: 1.2.0
status: ativa
historico:
- versao: 1.2.0
  data: '2026-11-27'
  mudanca: contrato de publicação e acesso restrito, hash SQL e disponibilidade explícita sem ENEM; fórmulas preservadas
- versao: 1.1.0
  data: '2026-11-24'
  mudanca: interface executável com ano e filtros parametrizados; preserva população, média e supressão
- versao: 1.0.0
  data: 2026-11-22
  mudanca: primeira definição
dono: lucasarruda9
descricao: Percentual das escolas do ENEM encontradas no Censo.
grao: uma linha por escola do ENEM e ano
formula: |
  select count(*) as escolas_enem,
         count(*) filter (where encontrada) as encontradas,
         count(*) filter (where not encontrada) as nao_encontradas,
         count(*) filter (where mascarada) as mascaradas,
         round(100.0 * count(*) filter (where encontrada) / nullif(count(*),0), 1) as percentual
  from metricas.base_cobertura e cross join parametros q where e.ano = q.ano
fonte:
- entrada_transformacao.enem_escola_ano
- gold.dim_escola
filtros:
- ano
supressao:
  minimo: 0
  regra: sem supressão
consumidores:
- painel
- comando cobertura-enem
interface:
  parametros:
  - ano
  item_obrigatorio: false
