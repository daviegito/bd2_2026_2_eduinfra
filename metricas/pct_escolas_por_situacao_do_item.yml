nome: pct_escolas_por_situacao_do_item
titulo: Percentual de escolas por situação do item
versao: 1.1.0
status: ativa
historico:
- versao: 1.1.0
  data: '2026-11-24'
  mudanca: interface executável com ano e filtros parametrizados; preserva população, média e supressão
- versao: 1.0.0
  data: 2026-11-22
  mudanca: primeira definição
dono: lucasarruda9
descricao: Percentual das escolas do grupo em cada situação de um item.
grao: uma linha por escola
formula: |
  with contagens as (
      select coalesce(e.itens_censo->>q.item, 'nao_informado') as situacao, count(*) as n_escolas
      from metricas.base_analise e cross join parametros q
      where e.ano = q.ano
      and (q.uf is null or e.uf = q.uf)
      and (q.municipio is null or e.co_municipio = q.municipio)
      and (q.rede is null or e.rede = q.rede)
      and (q.localizacao is null or e.localizacao = q.localizacao)
      group by 1
  )
  select situacao, n_escolas, round(100.0 * n_escolas / sum(n_escolas) over (), 1) as percentual
  from contagens order by situacao
fonte:
- gold.dim_escola
- gold.dim_municipio
- gold.dim_escola_infraestrutura
- gold.fato_desempenho_escola_ano
filtros:
- item
- UF
- município
- rede
- localização
supressao:
  minimo: 0
  regra: sem supressão
consumidores:
- painel
- consulta otimizada
interface:
  parametros:
  - ano
  - uf
  - municipio
  - rede
  - localizacao
  - item
  item_obrigatorio: true
